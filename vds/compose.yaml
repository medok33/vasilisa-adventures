name: vasilisa-adventures

services:
  app:
    build:
      context: ..
      dockerfile: vds/Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      TZ: Europe/Moscow
      SITE_AUTH_USERNAME: ${SITE_AUTH_USERNAME:?Set SITE_AUTH_USERNAME on the VDS}
      SITE_AUTH_PASSWORD: ${SITE_AUTH_PASSWORD:?Set SITE_AUTH_PASSWORD on the VDS}
      SITE_AUTH_SECRET: ${SITE_AUTH_SECRET:?Set SITE_AUTH_SECRET on the VDS}
      DAD_PHONE: ${DAD_PHONE:?Set DAD_PHONE on the VDS}
      DAD_VK_URL: ${DAD_VK_URL:?Set DAD_VK_URL on the VDS}
      DAD_MAX_URL: ${DAD_MAX_URL:?Set DAD_MAX_URL on the VDS}
    volumes:
      - vasilisa_data:/data
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vasilisa_internal

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - vasilisa_internal

networks:
  vasilisa_internal:
    name: vasilisa-adventures-internal

volumes:
  vasilisa_data:
    name: vasilisa-adventures-data
  caddy_data:
    name: vasilisa-adventures-caddy-data
  caddy_config:
    name: vasilisa-adventures-caddy-config
